
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Diwali 🪔</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    background:
      radial-gradient(ellipse at center, #542044 0%, #260e2e 55%, #100819 100%);
    font-family: Georgia, serif;
    color: #ffe6a0;
}

/* Background glow */
.glow {
    position: absolute;
    width: 450px;
    height: 450px;
    background: #ff9d28;
    filter: blur(150px);
    opacity: 0.18;
    border-radius: 50%;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%);
}

/* Main content */
.container {
    position: relative;
    z-index: 5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
}

.subtitle {
    color: #ffd68b;
    letter-spacing: 8px;
    font-size: 14px;
    margin-bottom: 22px;
    animation: fadeIn 2s ease;
}

h1 {
    font-size: clamp(42px, 9vw, 100px);
    line-height: 1.2;
    letter-spacing: 5px;
    background: linear-gradient(
        90deg,
        #fff4bd,
        #ffbb36,
        #fff0a6,
        #ff9c19
    );
    background-size: 200%;
    -webkit-background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 15px #ffb52d);
    animation: shine 4s linear infinite, appear 2s ease;
}

.message {
    margin-top: 25px;
    color: #ffe8bd;
    font-size: clamp(15px, 2vw, 21px);
    letter-spacing: 2px;
    line-height: 1.8;
    animation: fadeIn 3s ease;
}

.divider {
    width: 160px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #ffd36d, transparent);
    margin: 25px auto;
}

/* Diyas */
.diyas {
    display: flex;
    justify-content: center;
    gap: clamp(25px, 7vw, 70px);
    margin-top: 55px;
    flex-wrap: wrap;
}

.diya {
    position: relative;
    width: 65px;
    height: 32px;
    background: linear-gradient(#ffbd4a, #a93d08);
    border-radius: 10px 10px 45px 45px;
    box-shadow: 0 8px 20px #ff7b19;
}

.diya::before {
    content: "";
    position: absolute;
    width: 76px;
    height: 12px;
    background: linear-gradient(#ffe69b, #d87a17);
    border-radius: 50%;
    top: -5px;
    left: -5px;
}

.flame {
    position: absolute;
    width: 17px;
    height: 30px;
    background: linear-gradient(to top, #ff4d00, #ffcf43, #fff8bd);
    border-radius: 50% 50% 45% 45%;
    top: -35px;
    left: 24px;
    transform-origin: bottom;
    box-shadow: 0 0 20px #ffae28, 0 0 35px #ff7900;
    animation: flicker 0.7s infinite alternate;
}

@keyframes flicker {
    from { transform: rotate(-8deg) scale(0.9); }
    to { transform: rotate(8deg) scale(1.1); }
}

/* Falling flowers */
.falling {
    position: absolute;
    top: -50px;
    z-index: 3;
    animation: fall linear infinite;
    pointer-events: none;
    user-select: none;
}

@keyframes fall {
    0% {
        transform: translateY(-10vh) rotate(0deg);
        opacity: 0;
    }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% {
        transform: translateY(115vh) rotate(600deg);
        opacity: 0;
    }
}

/* Sparkles */
.sparkle {
    position: absolute;
    color: #ffe69b;
    animation: twinkle 2s infinite alternate;
    z-index: 1;
}

@keyframes twinkle {
    from { opacity: 0.2; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1.4); }
}

@keyframes shine {
    to { background-position: 200%; }
}

@keyframes appear {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.footer {
    position: absolute;
    bottom: 22px;
    font-size: 12px;
    letter-spacing: 3px;
    color: #dcae72;
    opacity: 0.8;
}

@media(max-width: 500px) {
    .subtitle { letter-spacing: 4px; }
    h1 { letter-spacing: 2px; }
    .diyas { gap: 35px; }
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="container">

    <div class="subtitle">✦ THE FESTIVAL OF LIGHTS ✦</div>

    <h1>HAPPY<br>DIWALI</h1>

    <div class="divider"></div>

    <div class="message">
        May your life shine brighter than a thousand diyas ✨
        <br>
        May happiness, prosperity & love fill your home.
    </div>

    <div class="diyas">
        <div class="diya"><div class="flame"></div></div>
        <div class="diya"><div class="flame"></div></div>
        <div class="diya"><div class="flame"></div></div>
        <div class="diya"><div class="flame"></div></div>
        <div class="diya"><div class="flame"></div></div>
    </div>

</div>

<div class="footer">
    ✨ LIGHT • LOVE • PROSPERITY ✨
</div>

<script>
// Falling flowers and petals
const flowers = ["🌸", "🌺", "🌼", "🌹", "💮", "🌻", "🪷"];

function createFlower() {
    const flower = document.createElement("div");
    flower.className = "falling";
    flower.innerHTML =
        flowers[Math.floor(Math.random() * flowers.length)];

    flower.style.left = Math.random() * 100 + "vw";
    flower.style.fontSize = (15 + Math.random() * 20) + "px";
    flower.style.animationDuration = (6 + Math.random() * 8) + "s";
    flower.style.animationDelay = Math.random() * 2 + "s";

    document.body.appendChild(flower);

    setTimeout(() => flower.remove(), 16000);
}

setInterval(createFlower, 300);

// Floating sparkles
function createSparkle() {
    const sparkle = document.createElement("div");
    sparkle.className = "sparkle";
    sparkle.innerHTML = "✦";

    sparkle.style.left = Math.random() * 100 + "vw";
    sparkle.style.top = Math.random() * 100 + "vh";
    sparkle.style.fontSize = (8 + Math.random() * 15) + "px";
    sparkle.style.animationDelay = Math.random() * 2 + "s";

    document.body.appendChild(sparkle);

    setTimeout(() => sparkle.remove(), 4000);
}

setInterval(createSparkle, 250);
</script>

</body>
</html>
